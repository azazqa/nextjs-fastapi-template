[project]
name = "app"
version = "0.0.6"
description = ""
authors = [{ name = "Anderson Resende", email = "anderson@vinta.com.br" }]
requires-python = ">=3.14,<3.15"
readme = "README.md"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "asyncpg>=0.31.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "pydantic-settings>=2.5.2,<3",
    "fastapi-mail>=1.6.8",
    "fastapi-pagination>=0.15.16",
    "openpyxl>=3.1.2,<4",
    "msoffcrypto-tool>=5,<6",
    "watchfiles>=1.1.0",
    "greenlet>=3.2.3",
    "pillow>=11.3.0",
    "apscheduler>=3.11.2",
    "psycopg2-binary>=2.9.12",
    "redis>=5.2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.4.0,<4",
    "ruff>=0.1.0,<0.2",
    "watchdog>=5.0.3,<6",
    "python-dotenv>=1.0.1,<2",
    "pytest>=9.1.0,<10",
    "pytest-mock>=3.14.0,<4",
    "mypy>=1.13.0,<2",
    "coveralls>=4.0.1,<5",
    "alembic>=1.14.0,<2",
    "pytest-asyncio>=1.4.0,<2",
    "mkdocs-material>=9.6.9",
    "mkdocs-material[imaging]>=9.6.9",
]

[tool.uv]
package = false

[tool.hatch.build.targets.sdist]
include = ["commands"]

[tool.hatch.build.targets.wheel]
include = ["commands"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
